[package]
name = "telegram-me-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native core of TelegramMe: t.me page parsing and feed ranking"
license = "Apache-2.0"
publish = false

[lib]
name = "telegram_me_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
ego-tree = "0.11"
fancy-regex = "0.19.2"
rayon = "1.12.0"
regex = "1.13.1"
scraper = { version = "0.29.0", default-features = false, features = ["deterministic"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
rustc-hash = "2.1.3"
pyo3 = { version = "0.30.1", features = ["abi3-py313"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
