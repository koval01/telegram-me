name: Deploy

# Rolling deployment to every server in SERVERS_IPS, one at a time. Each
# server runs deploy/remote-deploy.sh, which rolls back to the previous image
# if the new one does not become healthy; the rollout stops at the first
# failing server. Run it manually with an older tag to roll back everything.
# Server addresses are masked in the logs; servers are shown as 1, 2, ...
# With the PUBLIC_HOST variable set, every server also runs Caddy on :443
# (deploy/Caddyfile) for Cloudflare to connect to.

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy, e.g. sha-0123456789ab, 2.0.0 or latest"
        type: string
        required: true
        default: latest
      with_worker:
        description: "Also run the standalone feed worker"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE: ${{ vars.DEPLOY_IMAGE || 'docker.io/koval01/telegram-me' }}:${{ inputs.image_tag }}
      SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
      PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
      WITH_WORKER: ${{ inputs.with_worker && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVERS: ${{ secrets.SERVERS_IPS }}
        run: |
          for server in $SERVERS; do echo "::add-mask::$server"; done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret is not set; trusting host keys on first use."
            for server in $SERVERS; do ssh-keyscan -T 10 "$server" >> ~/.ssh/known_hosts 2>/dev/null; done
          fi

      - name: Render production .env
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
        run: |
          umask 077
          [[ "$PUBLIC_HOST" =~ ^[A-Za-z0-9.-]*$ ]] || { echo "::error::invalid PUBLIC_HOST"; exit 1; }
          mkdir -p deploy/certs
          caddy_tls=internal
          if [ -n "$PUBLIC_HOST" ] && [ -n "$TLS_CERT" ] && [ -n "$TLS_KEY" ]; then
            # Read by Caddy (root without DAC_OVERRIDE) in a directory only the
            # deploy user can reach on the server.
            printf '%s\n' "$TLS_CERT" > deploy/certs/origin.pem
            printf '%s\n' "$TLS_KEY" > deploy/certs/origin.key
            chmod 755 deploy/certs && chmod 644 deploy/certs/origin.pem deploy/certs/origin.key
            caddy_tls="/certs/origin.pem /certs/origin.key"
          fi
          if [ -n "$PUBLIC_HOST" ]; then
            app_bind=127.0.0.1
            forwarded_allow_ips="${{ vars.FORWARDED_ALLOW_IPS || '172.29.53.0/24' }}"
          else
            app_bind=0.0.0.0
            forwarded_allow_ips="${{ vars.FORWARDED_ALLOW_IPS || '127.0.0.1' }}"
          fi
          cat > deploy/.env <<EOF
          REDIS_URL=${REDIS_URL}
          ENABLE_FEED=${{ vars.ENABLE_FEED || 'true' }}
          ENABLE_PREVIEWS=${{ vars.ENABLE_PREVIEWS || 'true' }}
          ENABLE_RATE_LIMIT=${{ vars.ENABLE_RATE_LIMIT || 'false' }}
          RATE_LIMIT_RPM=${{ vars.RATE_LIMIT_RPM || '120' }}
          CACHE_MODE=${{ vars.CACHE_MODE || 'normal' }}
          PARSER_MODE=${{ vars.PARSER_MODE || 'full' }}
          FEED_REFRESH_MODE=${{ inputs.with_worker && 'worker' || 'embedded' }}
          FORWARDED_ALLOW_IPS=${forwarded_allow_ips}
          DISABLE_DOCS=${{ vars.DISABLE_DOCS || 'false' }}
          LOG_FORMAT=json
          APP_BIND=${app_bind}
          PUBLIC_HOST=${PUBLIC_HOST:-localhost}
          CADDY_TLS=${caddy_tls}
          EOF
          sed -i 's/^ *//' deploy/.env

      - name: Roll out ${{ env.IMAGE }}
        env:
          SERVERS: ${{ secrets.SERVERS_IPS }}
        run: |
          set -euo pipefail
          # Values below are interpolated into the remote command on purpose.
          [[ "$IMAGE" =~ ^[A-Za-z0-9./:_@-]+$ ]] || { echo "::error::invalid image: $IMAGE"; exit 1; }
          profiles=()
          if [ -n "$PUBLIC_HOST" ]; then profiles+=(proxy); fi
          if [ "$WITH_WORKER" = true ]; then profiles+=(worker); fi
          COMPOSE_PROFILES="$(IFS=,; echo "${profiles[*]}")"
          ssh_opts=(-i ~/.ssh/id_deploy -o BatchMode=yes -o ConnectTimeout=15 -o LogLevel=ERROR)
          number=0
          for server in $SERVERS; do
            number=$((number + 1))
            echo "::group::server $number"
            target="$SSH_USER@$server"
            ssh "${ssh_opts[@]}" "$target" 'mkdir -p ~/telegram-me && chmod 700 ~/telegram-me'
            scp -q -r "${ssh_opts[@]}" deploy/compose.prod.yaml deploy/remote-deploy.sh deploy/.env \
              deploy/Caddyfile deploy/certs "$target:telegram-me/"
            # shellcheck disable=SC2029
            ssh "${ssh_opts[@]}" "$target" \
              "chmod 600 ~/telegram-me/.env && COMPOSE_PROFILES='$COMPOSE_PROFILES' bash ~/telegram-me/remote-deploy.sh '$IMAGE'"
            echo "::endgroup::"
          done

      - name: Public health check
        if: vars.PUBLIC_HEALTHCHECK_URL != ''
        run: curl -fsS --retry 5 --retry-delay 5 "${{ vars.PUBLIC_HEALTHCHECK_URL }}"

      - name: Clean up secrets
        if: always()
        run: rm -rf ~/.ssh/id_deploy deploy/.env deploy/certs
