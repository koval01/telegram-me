name: TEMP image timing (remove before review)

# Temporary: times the release image build under QEMU against native
# per-platform runners (cold, no cache), on this branch and on PR #212 (wreq),
# and runs the merge step of release.yml against a local registry.

on:
  pull_request:
    paths: [".github/workflows/tmp-image-timing.yml"]

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      version: ${{ steps.meta.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
    steps:
      - id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            localhost:5000/ghcr
            localhost:5000/hub
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.sha_tag }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

  qemu:
    name: Before, QEMU amd64+arm64 (${{ matrix.source }})
    runs-on: ubuntu-latest
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: branch
            ref: ""
          - source: wreq
            ref: feat/browser-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

  native:
    name: After, ${{ matrix.platform }} native (${{ matrix.source }})
    runs-on: ${{ matrix.runner }}
    needs: [meta]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {source: branch, ref: "", platform: linux/amd64, runner: ubuntu-latest}
          - {source: branch, ref: "", platform: linux/arm64, runner: ubuntu-24.04-arm}
          - {source: wreq, ref: feat/browser-client, platform: linux/amd64, runner: ubuntu-latest}
          - {source: wreq, ref: feat/browser-client, platform: linux/arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - if: matrix.source == 'branch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          retention-days: 1

  merge:
    name: After, merge (local registry)
    runs-on: ubuntu-latest
    needs: [meta, native]
    services:
      registry:
        image: registry:3
        ports: ["5000:5000"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/oci
          pattern: oci-*
      - name: Push the platform images by digest (stands in for the build jobs)
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          for tar in "$RUNNER_TEMP"/oci/*/image.tar; do
            pair=$(basename "$(dirname "$tar")")
            for image in localhost:5000/ghcr localhost:5000/hub; do
              skopeo copy --all --preserve-digests --dest-tls-verify=false \
                "oci-archive:$tar" "docker://$image:$pair"
            done
            digest=$(skopeo inspect --raw --tls-verify=false "docker://localhost:5000/ghcr:$pair" | sha256sum | cut -d' ' -f1)
            touch "$RUNNER_TEMP/digests/$digest"
          done
          ls -l "$RUNNER_TEMP/digests"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true
      # Verbatim from release.yml (job image, step merge).
      - id: merge
        name: Create and push the manifest lists
        working-directory: ${{ runner.temp }}/digests
        env:
          METADATA: ${{ needs.meta.outputs.json }}
          SHA_TAG: ${{ needs.meta.outputs.sha_tag }}
          GHCR_IMAGE: localhost:5000/ghcr
          HUB_IMAGE: localhost:5000/hub
        run: |
          for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            mapfile -t tags < <(jq -r --arg image "$image" \
              '.tags[] | select(startswith($image + ":")) | "--tag=" + .' <<<"$METADATA")
            sources=()
            for digest in *; do sources+=("$image@sha256:$digest"); done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$image:$SHA_TAG"
          done
          digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:$SHA_TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Check the result
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          SHA_TAG: ${{ needs.meta.outputs.sha_tag }}
        run: |
          set -x
          test -n "$DIGEST"
          for image in localhost:5000/ghcr localhost:5000/hub; do
            raw=$(docker buildx imagetools inspect --raw "$image:$SHA_TAG")
            jq . <<<"$raw"
            jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort == ["linux/amd64","linux/arm64","unknown/unknown","unknown/unknown"]' <<<"$raw"
            jq -e '[.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")] | length == 2' <<<"$raw"
            docker buildx imagetools inspect "$image:$SHA_TAG" --format '{{json .Provenance}}' > prov.json
            jq -e '.["linux/amd64"].SLSA and .["linux/arm64"].SLSA' prov.json > /dev/null
            docker buildx imagetools inspect "$image:$SHA_TAG" --format '{{json .SBOM}}' > sbom.json
            jq -e '.["linux/amd64"].SPDX and .["linux/arm64"].SPDX' sbom.json > /dev/null
            docker buildx imagetools inspect "$image:$SHA_TAG" --format '{{json .Image}}' > image.json
            jq '.["linux/arm64"].config.Labels' image.json
            jq -e '.["linux/amd64"].config.Labels["org.opencontainers.image.revision"] and .["linux/arm64"].config.Labels["org.opencontainers.image.version"]' image.json
          done
          echo "ghcr: $DIGEST"
          docker buildx imagetools inspect localhost:5000/hub:"$SHA_TAG" --format '{{json .Manifest}}' | jq -r .digest
