# cargo-deny: what the dependency tree may contain (`make audit`, CI Lint).
# https://embarkstudios.github.io/cargo-deny/
#
# fuzz/ has its own lockfile but is never shipped, so it is not checked here.

[graph]
# The extension (feature `python`) is what ships; check its tree too.
all-features = true

[advisories]
# RustSec advisories fail the build; so do unmaintained crates anywhere in the
# tree and yanked versions.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with shipping under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# MPL-2.0 is file-level copyleft: fine for unmodified crates whose source is
# on crates.io, but each new one should be a decision, not an accident. These
# are the CSS parts of scraper (Servo).
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    # Mozilla's root certificates as data, bundled by wreq so the TLS trust
    # store does not depend on the image. A permissive data license.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # The ecosystem is mid-move to syn 3 (serde, pyo3); phf_macros and
    # derive_more (via html5ever) are still on 2. Build time only.
    { crate = "syn@2", reason = "phf_macros and derive_more-impl are still on syn 2" },
    # wreq-util 0.2 decompresses TLS certificates (Chrome's compress_certificate)
    # with brotli 8 and zstd 0.13; wreq's body decoding (tower-http) and our
    # cache use brotli 9 and zstd 0.14.
    { crate = "brotli@8", reason = "wreq-util 0.2 certificate decompression" },
    { crate = "brotli-decompressor@5", reason = "brotli 8, via wreq-util 0.2" },
    { crate = "alloc-no-stdlib@2", reason = "brotli 8, via wreq-util 0.2" },
    { crate = "alloc-stdlib@0.2", reason = "brotli 8, via wreq-util 0.2" },
    { crate = "zstd@0.13", reason = "wreq-util 0.2 certificate decompression" },
    { crate = "zstd-safe@7", reason = "zstd 0.13, via wreq-util 0.2" },
    { crate = "shlex@1", reason = "bindgen (BoringSSL bindings, build time only)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
