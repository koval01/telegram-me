[package]
name = "telegram-me-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native core of TelegramMe: t.me page parsing, feed ranking and the in-process cache"
license = "Apache-2.0"
publish = false

[lib]
name = "telegram_me_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
ego-tree = "0.11"
fancy-regex = "0.19.2"
rayon = "1.12.0"
regex = "1.13.1"
scraper = { version = "0.29.0", default-features = false, features = ["deterministic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
rustc-hash = "2.1.3"
pyo3 = { version = "0.30.1", features = ["abi3-py313"], optional = true }
moka = { version = "0.12.16", features = ["sync"] }
zstd = { version = "0.14.3", default-features = false }
hmac = "0.13.0"
sha2 = "0.11.0"
base64 = "0.23.1"
getrandom = "0.4.3"

# Line coverage `cargo llvm-cov` must reach in CI; raise it with the tests
# that earn it, never lower it (scripts/coverage_floor.py).
[package.metadata.coverage]
fail-under-lines = 96

[features]
default = []
python = ["dep:pyo3"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
cap = "0.1.2"
flate2 = "1.1.10"

# Dependencies (html5ever, regex, ...) optimised in tests too: the parser
# tests run whole pages thousands of times (tests/hostile_html.rs).
[profile.dev.package."*"]
opt-level = 2
