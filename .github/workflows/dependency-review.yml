name: Dependency review

# Dependencies a pull request adds or changes (uv.lock, Cargo.lock, the
# actions), checked against the GitHub Advisory Database: any known
# vulnerability fails, and so do strong copyleft licenses, which cannot ship
# in an Apache-2.0 image. cargo-deny checks the Rust licenses in full.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            SSPL-1.0, BUSL-1.1
          show-patched-versions: true
