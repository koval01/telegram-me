name: Scorecard

# OpenSSF Scorecard: the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, ...). Findings go to
# the Security tab as code-scanning alerts; nothing is published elsewhere.
# It reads the default branch only, so it runs on main and weekly.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-24.04
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Read the workflow runs (for the CI-Tests check).
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
