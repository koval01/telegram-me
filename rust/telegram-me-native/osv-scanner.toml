# Vulnerabilities osv-scanner (and OpenSSF Scorecard, which reads this file) must not report,
# with why each cannot apply. Keep in step with [advisories] ignore in deny.toml, and remove
# these once wreq-util moves to zstd >= 0.14.3 (cargo tree -i zstd@0.13.3 comes back empty).

[[IgnoredVulns]]
id = "RUSTSEC-2026-0391"  # Data from an abandoned stream leaks into the next stream (zstd 0.13.3)
ignoreUntil = 2027-01-26T00:00:00Z
reason = "Only in zstd 0.13.3 / zstd-safe 7.3.0, which wreq-util 0.2 uses solely for TLS certificate decompression in its Firefox profiles; http.rs accepts Chromium profiles only (parse_profile), so that code never runs. Responses use zstd 0.14.3 / zstd-safe 8.2.0, which are fixed."

