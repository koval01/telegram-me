name: Deploy

# Rolling deployment to every server in SERVERS_IPS (deploy/rollout.sh):
#
# - Server 1 is the canary. deploy/remote-deploy.sh starts the image, waits
#   for its health check and runs the smoke test (scripts/smoke_matrix.py)
#   inside the container; on failure that server goes back to its previous
#   image. The canary then serves real traffic for CANARY_SOAK seconds and is
#   verified again before any other server is touched.
# - The other servers follow one at a time, with the same checks.
# - Last, the smoke test runs through the public URL (Cloudflare, Caddy).
#
# When a check fails after some servers took the release, all of them are
# rolled back, so the fleet never stays split. Run the workflow manually with
# an older tag to roll back everything; uncheck "smoke" only when t.me itself
# is down. Server addresses are masked in the logs; servers are shown as
# 1, 2, ... With the PUBLIC_HOST variable set, every server also runs Caddy on
# :443 (deploy/Caddyfile) for Cloudflare to connect to.

on:
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
    secrets:
      SSH_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: false
      SERVERS_IPS:
        required: true
      REDIS_URL:
        required: false
      TLS_CERT:
        required: false
      TLS_KEY:
        required: false
      POW_SECRET:
        required: false
      PEER_SECRET:
        required: false
      CF_BYPASS_KEY:
        required: false
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy, e.g. sha-0123456789ab, 2.0.0 or latest"
        type: string
        required: true
        default: latest
      with_worker:
        description: "Also run the standalone feed worker"
        type: boolean
        default: false
      smoke:
        description: "Smoke-test every server and the public URL (uncheck only while t.me is down)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    env:
      IMAGE: ${{ vars.DEPLOY_IMAGE || 'docker.io/koval01/telegram-me' }}:${{ inputs.image_tag }}
      SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
      PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
      WITH_WORKER: ${{ inputs.with_worker && 'true' || 'false' }}
      # Only a manual run can skip it: a release (workflow_call) is always smoke-tested.
      SMOKE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.smoke) && '0' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVERS: ${{ secrets.SERVERS_IPS }}
        run: |
          for server in $SERVERS; do echo "::add-mask::$server"; done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret is not set; trusting host keys on first use."
            for server in $SERVERS; do ssh-keyscan -T 10 "$server" >> ~/.ssh/known_hosts 2>/dev/null; done
          fi

      - name: Render production .env
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_KEY: ${{ secrets.TLS_KEY }}
          POW_SECRET: ${{ secrets.POW_SECRET }}
          ENABLE_POW: ${{ vars.ENABLE_POW || 'false' }}
          # Repository variables reach the script through the environment, not
          # `${{ }}` in it: a value is then data, never shell code.
          VAR_FORWARDED_ALLOW_IPS: ${{ vars.FORWARDED_ALLOW_IPS }}
          VAR_ENABLE_FEED: ${{ vars.ENABLE_FEED || 'true' }}
          VAR_ENABLE_PREVIEWS: ${{ vars.ENABLE_PREVIEWS || 'true' }}
          VAR_ENABLE_RATE_LIMIT: ${{ vars.ENABLE_RATE_LIMIT || 'false' }}
          VAR_RATE_LIMIT_RPM: ${{ vars.RATE_LIMIT_RPM || '120' }}
          VAR_RATE_LIMIT_SHARED: ${{ vars.RATE_LIMIT_SHARED || 'true' }}
          VAR_RATE_LIMIT_BURST: ${{ vars.RATE_LIMIT_BURST }}
          VAR_POW_DIFFICULTY: ${{ vars.POW_DIFFICULTY || '18' }}
          VAR_POW_CHALLENGE_TTL: ${{ vars.POW_CHALLENGE_TTL || '300' }}
          VAR_POW_BIND_IP: ${{ vars.POW_BIND_IP || 'true' }}
          VAR_CACHE_MODE: ${{ vars.CACHE_MODE || 'normal' }}
          VAR_PARSER_MODE: ${{ vars.PARSER_MODE || 'full' }}
          VAR_DISABLE_DOCS: ${{ vars.DISABLE_DOCS || 'false' }}
          VAR_ENABLE_PEERS: ${{ vars.ENABLE_PEERS || 'false' }}
          VAR_PEERS: ${{ vars.PEERS }}
          VAR_PEER_PORT: ${{ vars.PEER_PORT || '7946' }}
          VAR_PEER_ALLOW_CIDR: ${{ vars.PEER_ALLOW_CIDR }}
          VAR_PEER_ENCRYPTION: ${{ vars.PEER_ENCRYPTION || 'false' }}
          # Base of the absolute URLs in /robots.txt and /sitemap.xml.
          VAR_PUBLIC_URL: ${{ vars.PUBLIC_URL || (vars.PUBLIC_HOST && format('https://{0}', vars.PUBLIC_HOST)) || '' }}
          PEER_SECRET: ${{ secrets.PEER_SECRET }}
        run: |
          umask 077
          if [ "$ENABLE_POW" = true ] && [ "${#POW_SECRET}" -lt 32 ]; then
            echo "::error::ENABLE_POW needs the POW_SECRET secret (at least 32 characters)"
            exit 1
          fi
          if [ "$VAR_ENABLE_PEERS" = true ] && [ "${#PEER_SECRET}" -lt 32 ]; then
            echo "::error::ENABLE_PEERS needs the PEER_SECRET secret (at least 32 characters)"
            exit 1
          fi
          [[ "$PUBLIC_HOST" =~ ^[A-Za-z0-9.-]*$ ]] || { echo "::error::invalid PUBLIC_HOST"; exit 1; }
          public_url="${VAR_PUBLIC_URL%/}"
          [[ "$public_url" =~ ^(https?://[A-Za-z0-9.:-]+)?$ ]] || { echo "::error::invalid PUBLIC_URL"; exit 1; }
          mkdir -p deploy/certs
          caddy_tls=internal
          if [ -n "$PUBLIC_HOST" ] && [ -n "$TLS_CERT" ] && [ -n "$TLS_KEY" ]; then
            # Read by Caddy (root without DAC_OVERRIDE) in a directory only the
            # deploy user can reach on the server.
            printf '%s\n' "$TLS_CERT" > deploy/certs/origin.pem
            printf '%s\n' "$TLS_KEY" > deploy/certs/origin.key
            chmod 755 deploy/certs && chmod 644 deploy/certs/origin.pem deploy/certs/origin.key
            caddy_tls="/certs/origin.pem /certs/origin.key"
          fi
          if [ -n "$PUBLIC_HOST" ]; then
            app_bind=127.0.0.1
            forwarded_allow_ips="${VAR_FORWARDED_ALLOW_IPS:-172.29.53.0/24}"
          else
            app_bind=0.0.0.0
            forwarded_allow_ips="${VAR_FORWARDED_ALLOW_IPS:-127.0.0.1}"
          fi
          feed_refresh_mode=embedded
          if [ "$WITH_WORKER" = true ]; then feed_refresh_mode=worker; fi
          cat > deploy/.env <<EOF
          REDIS_URL=${REDIS_URL}
          ENABLE_FEED=${VAR_ENABLE_FEED}
          ENABLE_PREVIEWS=${VAR_ENABLE_PREVIEWS}
          ENABLE_RATE_LIMIT=${VAR_ENABLE_RATE_LIMIT}
          RATE_LIMIT_RPM=${VAR_RATE_LIMIT_RPM}
          RATE_LIMIT_SHARED=${VAR_RATE_LIMIT_SHARED}
          ENABLE_POW=${ENABLE_POW}
          POW_DIFFICULTY=${VAR_POW_DIFFICULTY}
          POW_CHALLENGE_TTL=${VAR_POW_CHALLENGE_TTL}
          POW_BIND_IP=${VAR_POW_BIND_IP}
          CACHE_MODE=${VAR_CACHE_MODE}
          PARSER_MODE=${VAR_PARSER_MODE}
          FEED_REFRESH_MODE=${feed_refresh_mode}
          FORWARDED_ALLOW_IPS=${forwarded_allow_ips}
          DISABLE_DOCS=${VAR_DISABLE_DOCS}
          LOG_FORMAT=json
          ENABLE_PEERS=${VAR_ENABLE_PEERS}
          PEER_PORT=${VAR_PEER_PORT}
          PEER_ENCRYPTION=${VAR_PEER_ENCRYPTION}
          APP_BIND=${app_bind}
          PUBLIC_HOST=${PUBLIC_HOST:-localhost}
          CADDY_TLS=${caddy_tls}
          EOF
          sed -i 's/^ *//' deploy/.env
          # Optional values: only written when set (an empty value is invalid).
          if [ -n "$VAR_RATE_LIMIT_BURST" ]; then
            echo "RATE_LIMIT_BURST=${VAR_RATE_LIMIT_BURST}" >> deploy/.env
          fi
          if [ -n "$public_url" ]; then echo "PUBLIC_URL=${public_url}" >> deploy/.env; fi
          if [ -n "$POW_SECRET" ]; then echo "POW_SECRET=${POW_SECRET}" >> deploy/.env; fi
          if [ -n "$PEER_SECRET" ]; then echo "PEER_SECRET=${PEER_SECRET}" >> deploy/.env; fi
          # Private addresses of the servers, e.g. "10.0.0.108,10.0.0.165".
          if [ -n "$VAR_PEERS" ]; then echo "PEERS=${VAR_PEERS}" >> deploy/.env; fi
          if [ -n "$VAR_PEER_ALLOW_CIDR" ]; then
            echo "PEER_ALLOW_CIDR=${VAR_PEER_ALLOW_CIDR}" >> deploy/.env
          fi

      - name: Roll out ${{ env.IMAGE }}
        env:
          SERVERS: ${{ secrets.SERVERS_IPS }}
          CANARY_SOAK: ${{ vars.CANARY_SOAK || '60' }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL || (vars.PUBLIC_HOST && format('https://{0}', vars.PUBLIC_HOST)) || '' }}
          # Key of a Cloudflare WAF skip rule, so bot protection lets the smoke test through.
          BYPASS_KEY: ${{ secrets.CF_BYPASS_KEY }}
        run: |
          profiles=()
          if [ -n "$PUBLIC_HOST" ]; then profiles+=(proxy); fi
          if [ "$WITH_WORKER" = true ]; then profiles+=(worker); fi
          COMPOSE_PROFILES="$(IFS=,; echo "${profiles[*]}")" bash deploy/rollout.sh

      - name: Public health check
        if: vars.PUBLIC_HEALTHCHECK_URL != ''
        env:
          URL: ${{ vars.PUBLIC_HEALTHCHECK_URL }}
          BYPASS_KEY: ${{ secrets.CF_BYPASS_KEY }}
        run: |
          headers=()
          if [ -n "$BYPASS_KEY" ]; then headers=(-H "x-bypass-key: $BYPASS_KEY"); fi
          curl -fsS --retry 5 --retry-delay 5 "${headers[@]}" "$URL"

      - name: Clean up secrets
        if: always()
        run: rm -rf ~/.ssh/id_deploy deploy/.env deploy/certs
