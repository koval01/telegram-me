[package]
name = "telegram-me-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native core of TelegramMe: feed ranking (and, next, page parsing)"
license = "GPL-3.0-only"
publish = false

[lib]
name = "telegram_me_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.12.0"
rustc-hash = "2.1.3"
pyo3 = { version = "0.30.1", features = ["abi3-py313"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
