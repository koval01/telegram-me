name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  guards:
    uses: ./.github/workflows/guards.yml
    permissions:
      contents: read
      pull-requests: read

  # One manifest list built from per-platform images, each on a runner of its
  # own architecture: arm64 under QEMU took 28 min once the crate pulled in
  # BoringSSL (wreq). Each build pushes by digest; `image` merges the digests
  # and tags the result. https://docs.docker.com/build/ci/github-actions/multi-platform/
  meta:
    name: Image metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
      version: ${{ steps.meta.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
      json: ${{ steps.meta.outputs.json }}
    steps:
      - id: vars
        run: echo "sha_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/koval01/telegram-me
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.sha_tag }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: [ci, guards, meta]
    permissions:
      contents: read
      packages: write
    strategy:
      # A failed platform must not cancel the other's build and cache export;
      # "Re-run failed jobs" then rebuilds only the one that failed.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Untagged: `image` tags the merged manifest list.
          tags: |
            ghcr.io/${{ github.repository }}
            docker.io/koval01/telegram-me
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ steps.platform.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.pair }}
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: Push multi-arch image
    runs-on: ubuntu-24.04
    needs: [meta, build]
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      sha_tag: ${{ needs.meta.outputs.sha_tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
      # Per registry, from that registry's own copy of the platform images, so
      # no blobs cross registries. The attestations (provenance, SBOM) come
      # along with each platform's index.
      - id: merge
        name: Create and push the manifest lists
        working-directory: ${{ runner.temp }}/digests
        env:
          METADATA: ${{ needs.meta.outputs.json }}
          SHA_TAG: ${{ needs.meta.outputs.sha_tag }}
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          HUB_IMAGE: docker.io/koval01/telegram-me
        run: |
          for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            mapfile -t tags < <(jq -r --arg image "$image" \
              '.tags[] | select(startswith($image + ":")) | "--tag=" + .' <<<"$METADATA")
            sources=()
            for digest in *; do sources+=("$image@sha256:$digest"); done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$image:$SHA_TAG"
          done
          digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:$SHA_TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: [image]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.image.outputs.sha_tag }}
    # Only what the deployment uses, not every secret of the repository.
    secrets:
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      SERVERS_IPS: ${{ secrets.SERVERS_IPS }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      TLS_CERT: ${{ secrets.TLS_CERT }}
      TLS_KEY: ${{ secrets.TLS_KEY }}
      POW_SECRET: ${{ secrets.POW_SECRET }}
      PEER_SECRET: ${{ secrets.PEER_SECRET }}
      CF_BYPASS_KEY: ${{ secrets.CF_BYPASS_KEY }}

  github-release:
    name: GitHub release
    needs: [image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
