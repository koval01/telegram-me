name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.5"
  RUST_VERSION: "1.99"
  # Check tools outside uv.lock and Cargo.lock; `make tools` installs the same.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_MACHETE_VERSION: "0.9.2"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  HADOLINT_VERSION: "2.15.1"
  HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
  TRIVY_VERSION: "0.76.1"
  FORCE_COLOR: "1"
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/telegram-me-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component clippy,rustfmt,llvm-tools-preview
          rustup default "$RUST_VERSION"
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-machete@${{ env.CARGO_MACHETE_VERSION }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Python for the PyO3 build (abi3 needs >= 3.13)
        run: |
          uv python install 3.14
          echo "PYO3_PYTHON=$(uv python find 3.14)" >> "$GITHUB_ENV"
      - name: BoringSSL build tools (wreq's btls-sys runs cmake and bindgen)
        run: |
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends cmake libclang-dev
      - run: cargo fmt --check
      - name: Dependencies (RustSec advisories, licenses, duplicates, sources; deny.toml)
        run: cargo deny --locked check
      - name: Unused dependencies
        run: cargo machete
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features python -- -D warnings
      - name: Tests with line coverage (floor in Cargo.toml, see scripts/coverage_floor.py)
        run: |
          floor="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["metadata"]["coverage"]["fail-under-lines"])')"
          cargo llvm-cov --locked --summary-only --fail-under-lines "$floor" | tee coverage.txt
          {
            echo "### Rust line coverage (floor ${floor}%)"
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: cargo test --locked --doc

  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every commit, for gitleaks.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: BoringSSL build tools (wreq's btls-sys runs cmake and bindgen)
        run: |
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends cmake libclang-dev
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Layering (import-linter)
        run: uv run lint-imports
      - name: Dead code (vulture)
        run: uv run vulture
      - name: Known vulnerabilities in uv.lock
        run: uv audit --locked --preview-features audit-command
      - name: Spelling (typos)
        run: uv run typos --format brief
      - name: Shell scripts
        run: shellcheck deploy/*.sh
      - name: Workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Workflow security (zizmor, with the online audits)
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --format github .github
      - name: Install gitleaks and hadolint (checksums pinned above)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          printf '%s  %s\n' "$GITLEAKS_SHA256" gitleaks.tar.gz "$HADOLINT_SHA256" hadolint | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks hadolint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Dockerfile (hadolint)
        run: hadolint Dockerfile
      - name: Secrets in the whole history (gitleaks)
        run: gitleaks git --redact --no-banner --log-opts=--all .

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # The suite takes ~5 min with setup; a hang fails here instead of after 6 h.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - name: BoringSSL build tools (wreq's btls-sys runs cmake and bindgen)
        run: |
          sudo apt-get update -q
          sudo apt-get install --yes --no-install-recommends cmake libclang-dev
      - run: uv sync --locked
      - name: Offline tests and contract snapshots (coverage floor in pyproject.toml)
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - name: Coverage summary
        if: matrix.python == '3.14'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: [rust, lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: telegram-me:ci
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image.tar"
      # The integration and deploy jobs test this very image.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 1
      - name: Start the container hardened like production
        run: |
          docker run -d --name api -p 8000:3000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -e ENABLE_FEED=true telegram-me:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' api)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
      - name: Smoke matrix against live t.me
        run: uv run --no-project python scripts/smoke_matrix.py --base-url http://127.0.0.1:8000 --preset full
      - name: Graceful shutdown
        run: |
          start=$(date +%s)
          docker stop -t 15 api
          test "$(docker inspect -f '{{.State.ExitCode}}' api)" = 0
          echo "stopped in $(( $(date +%s) - start ))s"
      - name: Container logs
        if: failure()
        run: docker logs api

  image-scan:
    name: Image vulnerabilities (trivy)
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: trivy@${{ env.TRIVY_VERSION }}
      # Fails on high and critical vulnerabilities that have a fix; the table
      # lists all of them for the summary.
      - name: High and critical vulnerabilities with a fix
        run: |
          trivy image --input "$RUNNER_TEMP/image.tar" --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --format table --output trivy.txt || status=$?
          {
            echo "### Image vulnerabilities (high, critical, fixable)"
            echo '```'
            cat trivy.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat trivy.txt
          exit "${status:-0}"

  integration:
    name: Integration (2 servers × 2 workers, Valkey)
    runs-on: ubuntu-latest
    needs: [docker]
    env:
      TME_TEST_IMAGE: telegram-me:ci
      # What production runs now: the release a rolling deployment starts from.
      TME_PREVIOUS_IMAGE: docker.io/koval01/telegram-me:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image and the previous release
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker pull --quiet "$TME_PREVIOUS_IMAGE"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Shared cache, fetch lease, rate limit, proof of work, rolling upgrade, Valkey outage
        env:
          TME_LOG_DIR: ${{ runner.temp }}/logs
        run: uv run --only-group integration pytest --confcutdir tests/integration tests/integration -m integration
      - name: Container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: ${{ runner.temp }}/logs

  deploy-scripts:
    name: Deploy scripts (upgrade, rollback, proxy)
    runs-on: ubuntu-latest
    needs: [docker]
    env:
      TME_TEST_IMAGE: telegram-me:ci
      TME_PREVIOUS_IMAGE: docker.io/koval01/telegram-me:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/image.tar"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: remote-deploy.sh with real Docker Compose, rollout.sh with stub servers
        run: uv run --only-group integration pytest --confcutdir tests/deploy tests/deploy
