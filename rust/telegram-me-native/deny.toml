# cargo-deny: what the dependency tree may contain (`make audit`, CI Lint).
# https://embarkstudios.github.io/cargo-deny/
#
# fuzz/ has its own lockfile but is never shipped, so it is not checked here.

[graph]
# The extension (feature `python`) is what ships; check its tree too.
all-features = true

[advisories]
# RustSec advisories fail the build; so do unmaintained crates anywhere in the
# tree and yanked versions.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with shipping under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# MPL-2.0 is file-level copyleft: fine for unmodified crates whose source is
# on crates.io, but each new one should be a decision, not an accident. These
# are the CSS parts of scraper (Servo), and foca (SWIM membership of the peer
# layer), used as published.
exceptions = [
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    { allow = ["MPL-2.0"], crate = "foca" },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # The ecosystem is mid-move to syn 3 (serde, pyo3); phf_macros and
    # derive_more (via html5ever) are still on 2. Build time only.
    { crate = "syn@2", reason = "phf_macros and derive_more-impl are still on syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
