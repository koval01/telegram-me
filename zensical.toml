[project]
site_name = "TelegramMe"
site_description = "REST API for public Telegram channels, built on t.me web previews"
site_author = "Koval Yaroslav"
site_url = "https://koval01.github.io/telegram-me/"
repo_url = "https://github.com/koval01/telegram-me"
repo_name = "koval01/telegram-me"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2024–2026 Koval Yaroslav · Apache-2.0 License"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/quickstart.md",
    "getting-started/local-development.md",
  ] },
  { "API reference" = [
    "api/index.md",
    "api/channel-page.md",
    "api/more.md",
    "api/post.md",
    "api/previews.md",
    "api/feed.md",
    "api/graphql.md",
    "api/service.md",
    "api/models.md",
    "api/errors.md",
  ] },
  { "Configuration" = "configuration.md" },
  { "Deployment" = [
    "deployment/docker.md",
    "deployment/compose.md",
    "deployment/production.md",
    "deployment/reverse-proxy.md",
    "deployment/upgrading.md",
  ] },
  { "Internals" = [
    "internals/architecture.md",
    "internals/caching.md",
    "internals/feed.md",
    "internals/parsing.md",
    "internals/performance.md",
  ] },
  { "Contributing" = [
    "contributing/development.md",
    "contributing/testing.md",
    "contributing/releasing.md",
  ] },
  { "FAQ" = "faq.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/send"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "sky"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "sky"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/koval01/telegram-me"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
